<div class="p-6 max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">ציוני מבחן: מבוא למדעי המחשב</h1>
    
    <div class="space-x-2 rtl:space-x-reverse">
      <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">ממוצע: {{ averageScore }}</span>
      <button mat-raised-button color="primary" (click)="bulkExportPdf()">
        ייצוא מאושרים ל-PDF
      </button>
    </div>
  </div>

  <mat-form-field appearance="outline" class="w-full md:w-1/3 mb-4">
    <mat-label>סנן לפי סטטוס</mat-label>
    <mat-select (selectionChange)="applyFilter($event.value)">
      <mat-option value="all">הכל</mat-option>
      <mat-option value="ai_graded">נבדק ע"י AI</mat-option>
      <mat-option value="under_review">בבדיקה</mat-option>
      <mat-option value="approved">אושר</mat-option>
    </mat-select>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort class="w-full shadow-lg rounded-lg overflow-hidden">
    
    <ng-container matColumnDef="studentName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> שם תלמיד </th>
      <td mat-cell *matCellDef="let element" class="font-medium"> {{element.studentName}} </td>
    </ng-container>

    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ציון </th>
      <td mat-cell *matCellDef="let element">
        <span class="font-bold px-2 py-1 rounded"
              [ngClass]="{
                'text-green-700 bg-green-100': element.score >= 60,
                'text-orange-700 bg-orange-100': element.score >= 50 && element.score < 60,
                'text-red-700 bg-red-100': element.score < 50
              }">
          {{element.score}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> סטטוס </th>
      <td mat-cell *matCellDef="let element"> 
        {{ getStatusLabel(element.status) }} 
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> פעולות </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="goToReview(element.studentExamId)">
          <mat-icon>visibility</mat-icon> </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50"></tr>
  </table>
  <app-export-manager *ngIf="showBatchModal" [mode]="'BATCH'" [targetId]="classId" (close)="showBatchModal = false"></app-export-manager>
</div>
