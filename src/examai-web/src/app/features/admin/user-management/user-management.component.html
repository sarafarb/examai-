<div>
  <h1 class="text-2xl font-bold mb-6">ניהול משתמשים</h1>
  <div class="bg-white p-4 rounded shadow">
    <div class="flex gap-4 mb-4">
      <input type="text" placeholder="חיפוש לפי אימייל..." class="border p-2 rounded w-64" />
      <select class="border p-2 rounded">
        <option value="">כל התפקידים</option>
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>
    
    <table class="w-full text-right border-collapse">
      <thead>
        <tr class="bg-gray-100 border-b">
          <th class="p-3">שם</th>
          <th class="p-3">אימייל</th>
          <th class="p-3">תפקיד</th>
          <th class="p-3">סטטוס</th>
          <th class="p-3">תוכנית</th>
          <th class="p-3">פעולות</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users" class="border-b hover:bg-gray-50">
          <td class="p-3">{{ u.name }}</td>
          <td class="p-3">{{ u.email }}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded text-sm" 
                  [class.bg-purple-200]="u.role === 'admin'" 
                  [class.text-purple-800]="u.role === 'admin'"
                  [class.bg-blue-200]="u.role !== 'admin'" 
                  [class.text-blue-800]="u.role !== 'admin'">
              {{ u.role }}
            </span>
          </td>
          <td class="p-3">{{ u.status }}</td>
          <td class="p-3">{{ u.plan }}</td>
          <td class="p-3 flex gap-2">
            <button class="text-blue-600 hover:bg-blue-100 p-2 rounded">ערוך</button>
            <button (click)="handleDelete(u.id)" class="text-red-600 hover:bg-red-100 p-2 rounded">מחק</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
