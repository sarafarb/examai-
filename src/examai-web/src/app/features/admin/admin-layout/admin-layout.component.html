<div class="flex h-screen bg-gray-100" dir="rtl">
  <aside class="w-64 bg-slate-800 text-white flex flex-col">
    <div class="p-4 text-xl font-bold border-b border-slate-700">ExamAI Admin</div>
    <nav class="flex-1 p-4 space-y-2">
      <a *ngFor="let item of menu" 
         [routerLink]="item.path" 
         class="flex items-center gap-3 p-3 rounded transition-colors"
         [class.bg-blue-600]="isActive(item.path)"
         [class.hover:bg-slate-700]="!isActive(item.path)">
        {{ item.name }}
      </a>
    </nav>
  </aside>
  
  <main class="flex-1 p-8 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>
</div>
