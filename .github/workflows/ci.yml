name: ExamAI Continuous Integration

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        cache: true
        cache-dependency-path: src/backend/Directory.Packages.props

    - name: Restore Dependencies
      run: dotnet restore src/backend/ExamAI.sln

    - name: Build Backend
      run: dotnet build src/backend/ExamAI.sln --no-restore --configuration Release

    - name: Run Backend Tests
      env:
        AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
      run: dotnet test src/backend/ExamAI.sln --no-build --configuration Release

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/examai-web/package-lock.json

    - name: Install Dependencies
      run: npm ci
      working-directory: src/examai-web

    - name: Run Frontend Tests
      run: npm run test -- --run
      working-directory: src/examai-web

    - name: Build Frontend
      run: npm run build -- --configuration=production
      working-directory: src/examai-web

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Gateway Image (Dry Run)
      run: docker build -t examai-gateway:test -f src/backend/ExamAI.Gateway/Dockerfile src/backend/