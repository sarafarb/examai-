apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  namespace: examai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ocr-worker
  template:
    metadata:
      labels:
        app: ocr-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: ocr-worker
        image: examai-registry.local/ocr-worker:latest
        resources:
          limits:
            cpu: "1000m" # תהליכי OCR דורשים יותר כוח עיבוד
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets